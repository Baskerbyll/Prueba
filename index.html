<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barras de vida</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&display=swap">
<style>
  :root { --fondo:#17252b; --tarjeta:#1f333b; --texto:#ece6d6; --suave:#9fb0b3; --linea:#33505a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font-family:'Fraunces',Georgia,serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 20px; font-weight:800; }
  input, textarea, button { font:inherit; color:inherit; }
  input, textarea { width:100%; padding:12px 14px; background:var(--tarjeta); border:1px solid var(--linea); border-radius:8px; margin-bottom:12px; }
  button { cursor:pointer; background:var(--linea); border:0; border-radius:8px; padding:10px 14px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--texto); outline-offset:2px; }
  .oculto { display:none !important; }
  .tarjeta { background:var(--tarjeta); border-radius:12px; padding:16px; margin-bottom:14px; }
  .fila { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .nombre { font-size:1.2rem; font-weight:500; }
  .hp { font-size:2.6rem; font-weight:800; line-height:1; }
  .hp small { font-size:1rem; font-weight:500; color:var(--suave); }
  .barra { height:14px; background:#0f1a1e; border-radius:7px; overflow:hidden; }
  .barra i { display:block; height:100%; transition:width .4s, background .4s; }
  .botones { display:flex; gap:8px; margin-top:14px; }
  .botones button { flex:1; font-weight:800; }
  .botones .borrar { flex:0 0 auto; background:#5a2a2e; }
  .suave { color:var(--suave); }
  .enlace { background:none; color:var(--suave); text-decoration:underline; padding:8px 0; margin-top:16px; }
  .alta { display:grid; grid-template-columns:1fr 90px; gap:8px; }
  .alta button { grid-column:1/-1; background:#2f6b4f; }
  .estados { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .estado { background:#3a2f4d; border-radius:999px; padding:4px 12px; font-size:.9rem; }
  .estado button, .inventario li button { background:none; padding:0 0 0 8px; color:var(--suave); }
  .inventario { margin-top:14px; border-top:1px solid var(--linea); padding-top:10px; }
  .inventario h3 { margin:0 0 6px; font-size:.85rem; font-weight:500; color:var(--suave); }
  .inventario ul { margin:0; padding:0; }
  .inventario li { list-style:none; display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--linea); }
  .buscar { margin-top:14px; padding:12px; border-radius:8px; text-align:center; font-weight:800; background:#e0a030; color:#17252b; animation:brillo 1.1s infinite alternate; }
  @keyframes brillo { from { box-shadow:0 0 0 0 rgba(224,160,48,0); } to { box-shadow:0 0 18px 4px rgba(224,160,48,.8); } }
  @media (prefers-reduced-motion: reduce) { .buscar { animation:none; } }
  .dj-extra { margin-top:14px; display:grid; gap:8px; }
  .dj-extra form { display:flex; gap:6px; }
  .dj-extra form input { margin:0; }
  .dj-extra form.col { flex-direction:column; }
  .habs { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 12px; }
  .hab { width:62px; text-align:center; font-size:.7rem; color:var(--suave); }
  .hab span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .circulo { width:52px; height:52px; margin:0 auto 4px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.1rem; color:var(--c,#7fb069); background:color-mix(in srgb, var(--c,#7fb069) 28%, #17252b); border:2px solid var(--c,#7fb069); box-shadow:0 0 12px var(--c,#7fb069); cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; transition:opacity .3s; }
  .circulo.espera { opacity:.4; box-shadow:none; font-size:.85rem; color:var(--texto); }
  .circulo svg { pointer-events:none; }
  .vida { display:flex; align-items:center; gap:12px; }
  .vida .barra { flex:1; }
  .escudo { width:40px; height:46px; flex:none; }
  .escudo path { fill:#33505a; stroke:var(--texto); stroke-width:2; }
  .escudo text { fill:var(--texto); font-family:inherit; font-weight:800; font-size:18px; text-anchor:middle; }
  #descripcion { position:fixed; left:12px; right:12px; bottom:16px; z-index:10; background:#0f1a1e; border:1px solid var(--texto); border-radius:12px; padding:14px 16px; }
  #descripcion b { display:block; margin-bottom:4px; }
  .paleta { display:flex; flex-wrap:wrap; gap:8px; }
  .paleta label { position:relative; cursor:pointer; }
  .paleta input { position:absolute; opacity:0; width:1px; height:1px; margin:0; padding:0; }
  .paleta span { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; border:2px solid transparent; background:var(--linea); color:var(--texto); font-size:.8rem; }
  .paleta input:checked + span { border-color:var(--texto); }
  .paleta input:focus-visible + span { outline:2px solid var(--texto); outline-offset:2px; }
  .paleta svg { width:20px; height:20px; }
  .nombre-pj { text-align:center; font-size:1.3rem; font-weight:500; margin-bottom:12px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .nombre-pj.tiene { text-decoration:underline dotted; text-underline-offset:5px; }
  .cabecera { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .nivel { width:56px; height:56px; flex:none; border:2px solid var(--texto); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:1.4rem; font-weight:800; line-height:1; }
  .nivel small { font-size:.6rem; font-weight:500; color:var(--suave); }
  .barras2 { flex:1; display:grid; gap:8px; min-width:0; }
  .num { min-width:78px; font-size:.85rem; text-align:right; }
  .fila2 { display:flex; gap:10px; align-items:flex-start; }
  .atr { position:relative; flex:none; background:#0f1a1e; border:1px solid var(--linea); border-radius:8px; padding:8px 10px; font-size:.85rem; }
  .atr summary { list-style:none; cursor:pointer; }
  .atr summary::-webkit-details-marker { display:none; }
  .atr .resumen div { padding:2px 0; }
  .atr[open] .resumen { display:none; }
  .flecha { margin-top:4px; color:var(--suave); }
  .flecha::before { content:"▾"; }
  .atr[open] .flecha::before { content:"Características ▴"; }
  .atrfila { display:flex; gap:10px; align-items:baseline; padding:4px 0; border-top:1px solid var(--linea); }
  .atrfila span { flex:1; }
  .atrfila i { font-style:normal; width:28px; text-align:right; color:var(--suave); }
  .punto { display:none; position:absolute; top:-5px; right:-5px; width:12px; height:12px; border-radius:50%; background:#ffd400; animation:brillo 1.1s infinite alternate; }
  .punto.brilla { display:block; }
  .estbox { flex:1; min-width:0; min-height:90px; background:#0f1a1e; border:1px solid var(--linea); border-radius:8px; padding:8px 10px; }
  .estbox h3 { margin:0 0 6px; font-size:.8rem; font-weight:500; color:var(--suave); }
  .estbox .estados { margin-top:0; }
  .habs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 0; }
  .hab { width:auto; display:flex; align-items:center; gap:8px; text-align:left; font-size:.95rem; color:var(--texto); }
  .hab .circulo { width:42px; height:42px; margin:0; flex:none; }
  .papiro { margin-top:14px; padding:14px 16px; border-radius:6px; color:#3b2a14; background:repeating-linear-gradient(90deg, rgba(120,80,20,.05) 0 2px, transparent 2px 6px), radial-gradient(ellipse at 25% 10%, #f3e4b8 0%, #e4cd93 60%, #cdb173 100%); box-shadow:inset 0 0 28px rgba(120,80,20,.4), 0 2px 6px rgba(0,0,0,.4); }
  .papiro h3 { margin:0 0 8px; text-align:center; font-size:1rem; }
  .papiro ul { margin:0; padding:0; list-style:none; }
  .papiro li { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px dashed rgba(90,60,20,.45); }
  .papiro li span:first-child { flex:1; }
  .cant { min-width:36px; text-align:center; font-weight:800; border:1px solid rgba(90,60,20,.6); border-radius:6px; padding:2px 6px; }
  .cant.cero { opacity:.4; }
  .papiro button { background:none; color:#3b2a14; padding:0 4px; }
  .papiro .vacio { margin:0; text-align:center; opacity:.7; }
  .botones > span { width:30px; align-self:center; font-size:.8rem; color:var(--suave); }
  .dj-extra form input, .dj-extra form textarea { min-width:0; margin:0; }
  .dj-extra form.rej { display:grid; grid-template-columns:repeat(3,1fr); }
  .dj-extra form.rej button { grid-column:1/-1; }
  .ch { font-size:.75rem; color:var(--suave); }
  #descripcion { max-height:50vh; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Barras de vida</h1>

  <!-- Jugadores -->
  <div id="zonaJugador">
    <input id="nombre" placeholder="Escribe el nombre de tu personaje" autocomplete="off">
  </div>

  <!-- Login del DJ -->
  <div id="zonaLogin" class="oculto">
    <input id="correo" type="email" placeholder="Correo del DJ">
    <input id="clave" type="password" placeholder="Contraseña">
    <button id="entrar">Entrar como DJ</button>
    <p id="errorLogin" class="suave"></p>
  </div>

  <!-- Alta de personajes (solo DJ) -->
  <form id="zonaAlta" class="alta tarjeta oculto">
    <input id="altaNombre" placeholder="Nombre del personaje" required>
    <input id="altaMax" type="number" min="1" placeholder="HP máx." required>
    <button type="submit">Agregar personaje</button>
  </form>

  <div id="barras"></div>

  <button id="modo" class="enlace">Soy el DJ</button>
</main>
<div id="descripcion" class="oculto"></div>

<script type="module">
/* ============ 1. PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAzDs1VOmnHoZdDRbDpoV0EVUqWMSnO-k4",
  authDomain: "hp-dungeons-and-dragon.firebaseapp.com",
  databaseURL: "https://hp-dungeons-and-dragon-default-rtdb.firebaseio.com",
  projectId: "hp-dungeons-and-dragon",
  storageBucket: "hp-dungeons-and-dragon.firebasestorage.app",
  messagingSenderId: "964532300574",
  appId: "1:964532300574:web:0b96d06fc8a56cbca2b70f"
};
/* Mientras diga "PEGAR_AQUI" la página funciona en MODO DEMO
   (datos de prueba, solo en tu pantalla, sin sincronizar). */
/* ================================================================== */

const DEMO = firebaseConfig.apiKey === "PEGAR_AQUI";
const MAX_PERSONAJES = 6;
const MAX_OBJETOS = 7;
const MAX_HABILIDADES = 5;
const svg = d => `<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26" aria-hidden="true">${d}</svg>`;
const ICONOS = {
  curacion: svg('<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>'),
  accion: svg('<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>'),
  fisica: svg('<rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="8" y="11" width="8" height="2"/>'),
  mental: svg('<path fill-rule="evenodd" d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>')
};
const ATR = [["fue", "FUE"], ["des", "DES"], ["con", "CON"], ["int", "INT"], ["sab", "SAB"], ["car", "CAR"]];
const NOMBRES_ATR = { fue: "Fuerza", des: "Destreza", con: "Constitución", int: "Inteligencia", sab: "Sabiduría", car: "Carisma" };
const ATR_BASE = { fue: 10, des: 10, con: 10, int: 10, sab: 10, car: 10 };
const mod = n => { const m = Math.floor((n - 10) / 2); return (m >= 0 ? "+" : "−") + Math.abs(m); };
const abiertos = new Set();
const NOMBRES_ICONO = { curacion: "Curación", accion: "Acción adicional", fisica: "Proeza física", mental: "Proeza mental" };
const COLORES = { rojo: "#e5484d", naranja: "#f08a24", amarillo: "#e5c32e", verde: "#4caf6e", azul: "#3e8ef0", morado: "#8f6bf0", rosa: "#e86aa6", gris: "#9aa5a8" };
const $ = s => document.querySelector(s);
const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
const esc = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let personajes = {};
let esDJ = false;
let almacen;
let offsetReloj = 0;
const ahora = () => Date.now() + offsetReloj;

/* ---------- Almacén de datos: demo o Firebase ---------- */
if (DEMO) {
  personajes = {
    a: { nombre: "Thorin", hp: 24, max: 30 },
    b: { nombre: "Lyra", hp: 9, max: 18 }
  };
  almacen = {
    guardar: (id, d) => { personajes[id] = d; pintar(); },
    borrar: id => { delete personajes[id]; pintar(); },
    actualizar: async () => alert("El modo demo no guarda estos cambios."),
    usar: async () => alert("El modo demo no guarda estos cambios."),
    entrar: async () => { esDJ = true; vista(); },
    salir: async () => { esDJ = false; vista(); }
  };
} else {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const { initializeApp } = await import(base + "firebase-app.js");
  const { getDatabase, ref, onValue, set, remove, update } = await import(base + "firebase-database.js");
  const { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } = await import(base + "firebase-auth.js");
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  onValue(ref(db, "personajes"), snap => { personajes = snap.val() || {}; pintar(); });
  onValue(ref(db, ".info/serverTimeOffset"), s => { offsetReloj = s.val() || 0; });
  onAuthStateChanged(auth, u => { esDJ = !!u; vista(); });
  almacen = {
    guardar: (id, d) => set(ref(db, "personajes/" + id), d),
    borrar: id => remove(ref(db, "personajes/" + id)),
    actualizar: (id, campos) => update(ref(db, "personajes/" + id), campos),
    usar: (id, hab) => set(ref(db, `personajes/${id}/habilidades/${hab}/usadaEn`), ahora()),
    entrar: (c, p) => signInWithEmailAndPassword(auth, c, p),
    salir: () => signOut(auth)
  };
}

/* ---------- Dibujo ---------- */
function colorBarra(p) { return p > 50 ? "#7fb069" : p > 25 ? "#e0a030" : "#d64545"; }

function pintar() {
  const todos = Object.entries(personajes);
  const buscado = norm($("#nombre").value);
  const visibles = esDJ ? todos : todos.filter(([, c]) => buscado && norm(c.nombre) === buscado);

  if (!visibles.length) {
    $("#barras").innerHTML = `<p class="suave">${
      esDJ ? "Aún no hay personajes. Agrega el primero arriba."
           : buscado ? "No hay ningún personaje con ese nombre. Revisa cómo está escrito."
                     : "Escribe el nombre de tu personaje para ver su vida."}</p>`;
    return;
  }

  $("#barras").innerHTML = visibles.map(([id, c]) => {
    const xpMax = c.xpMax || 20, xp = c.xp || 0, nivel = c.nivel || 1, puntos = c.puntos || 0;
    const atr = { ...ATR_BASE, ...(c.atr || {}) };
    const p = Math.max(0, Math.min(100, c.hp / c.max * 100));
    const px = Math.max(0, Math.min(100, xp / xpMax * 100));
    const quitar = (attr, i) => esDJ ? `<button data-id="${id}" ${attr}="${i}" aria-label="Quitar">✕</button>` : "";
    const habs = Object.entries(c.habilidades || {}).filter(([, h]) => h && h.nombre).sort(([a], [b]) => a < b ? -1 : 1);
    const filaHabs = habs.length ? `<div class="habs">${habs.map(([hid, h]) => `<div class="hab"><div class="circulo" data-id="${id}" data-hab="${hid}" style="--c:${COLORES[h.color] || COLORES.verde}"></div><span>${esc(h.nombre)}</span></div>`).join("")}</div>` : "";
    const escudo = c.ca != null ? `<svg class="escudo" viewBox="0 0 40 46" role="img" aria-label="Clase de armadura ${Number(c.ca)}"><path d="M20 2 L37 8 V22 C37 33 29 41 20 44 C11 41 3 33 3 22 V8 Z"/><text x="20" y="29">${Number(c.ca)}</text></svg>` : "";
    const chips = (c.estados || []).map((t, i) => `<span class="estado">${esc(t)}${quitar("data-quitar-estado", i)}</span>`).join("");
    const inv = (c.inventario || []).map(t => typeof t === "string" ? { nombre: t, cantidad: 1 } : t);
    const filas = inv.map((o, i) => `<li><span>${esc(o.nombre)}</span><span class="cant${o.cantidad ? "" : " cero"}">${Number(o.cantidad) || 0}</span>${quitar("data-quitar-obj", i)}</li>`).join("");
    const papiro = (esDJ || inv.length) ? `<div class="papiro"><h3>Inventario (${inv.length}/${MAX_OBJETOS})</h3>${inv.length ? `<ul>${filas}</ul>` : `<p class="vacio">Vacío</p>`}</div>` : "";
    const aviso = (!esDJ && c.buscar) ? `<div class="buscar">🔍 ¡Puedes buscar!</div>` : "";
    const resumen = ATR.map(([k, n]) => `<div>${n} ${mod(atr[k])}</div>`).join("");
    const tabla = ATR.map(([k]) => `<div class="atrfila"><span>${NOMBRES_ATR[k]}</span><b>${atr[k]}</b><i>${mod(atr[k])}</i></div>`).join("");
    const caracteristicas = `<details class="atr" data-id="${id}"${abiertos.has(id) ? " open" : ""}><summary><span class="punto${puntos ? " brilla" : ""}"></span><div class="resumen">${resumen}</div><div class="flecha"></div></summary>${tabla}${puntos ? `<p class="suave">Puntos por asignar: ${puntos}</p>` : ""}</details>`;
    const botones = (attr, vals) => vals.map(d => `<button data-id="${id}" ${attr}="${d}" aria-label="${d > 0 ? "Sumar" : "Restar"} ${Math.abs(d)}">${d > 0 ? "+" : "−"}${Math.abs(d)}</button>`).join("");
    const controles = esDJ ? `
      <div class="botones"><span>HP</span>${botones("data-d", [-5, -1, 1, 5])}<button class="borrar" data-id="${id}" data-borrar aria-label="Borrar personaje">✕</button></div>
      <div class="botones"><span>XP</span>${botones("data-xp", [-5, -1, 1, 5])}</div>` : "";
    const extras = esDJ ? `
      <div class="dj-extra">
        <form data-form="ajustes" data-id="${id}"><input type="number" min="1" placeholder="HP máx. (${c.max})"><input type="number" min="1" placeholder="XP máx. (${xpMax})"><input type="number" min="1" placeholder="Nivel (${nivel})"><button>OK</button></form>
        <form class="rej" data-form="atr" data-id="${id}">${ATR.map(([k, n]) => `<label class="ch">${n}<input type="number" min="1" max="30" value="${atr[k]}"></label>`).join("")}<button>Guardar características</button></form>
        <form class="col" data-form="historia" data-id="${id}"><textarea rows="3" placeholder="Raza e historia (se ve al mantener presionado el nombre)">${esc(c.historia || "")}</textarea><button>Guardar texto</button></form>
        <form data-form="estado" data-id="${id}"><input placeholder="Nuevo estado (ej. Envenenado)" required><button>+</button></form>
        <form data-form="obj" data-id="${id}"><input placeholder="Nuevo objeto" required><input type="number" min="0" placeholder="Cant." value="1"><button>+</button></form>
        <form data-form="ca" data-id="${id}"><input type="number" min="0" max="40" placeholder="CA (armadura)" value="${c.ca ?? ""}" required><button>OK</button></form>
        <form class="col" data-form="hab" data-id="${id}"><input placeholder="Nueva habilidad" required><input type="number" min="0.1" step="any" placeholder="Enfriamiento (minutos)" required><input placeholder="Descripción">
          <div class="paleta">${Object.entries(COLORES).map(([k, hex]) => `<label><input type="radio" name="color" value="${k}"${k === "verde" ? " checked" : ""}><span style="background:${hex}" title="${k}"></span></label>`).join("")}</div>
          <div class="paleta"><label><input type="radio" name="icono" value="" checked><span title="Sin ícono (inicial)">Aa</span></label>${Object.entries(NOMBRES_ICONO).map(([k, n]) => `<label><input type="radio" name="icono" value="${k}"><span title="${n}">${ICONOS[k]}</span></label>`).join("")}</div>
          <button>Agregar habilidad</button></form>
        ${habs.length ? `<div class="estados">${habs.map(([hid, h]) => `<span class="estado">${esc(h.nombre)} · ${Number(h.minutos)} min<button data-id="${id}" data-quitar-hab="${hid}" aria-label="Quitar habilidad">✕</button></span>`).join("")}</div>` : ""}
        <button data-id="${id}" data-buscar>${c.buscar ? "Quitar aviso de búsqueda" : "🔍 Permitir buscar"}</button>
      </div>` : "";
    return `
      <div class="tarjeta">
        <div class="nombre-pj${c.historia ? " tiene" : ""}" data-id="${id}">${esc(c.nombre)}</div>
        ${aviso}
        <div class="cabecera">
          <div class="nivel" aria-label="Nivel ${nivel}"><small>Nivel</small>${nivel}</div>
          <div class="barras2">
            <div class="vida"><div class="barra"><i style="width:${px}%;background:#ffd400"></i></div><span class="num">${xp}/${xpMax} XP</span></div>
            <div class="vida"><div class="barra"><i style="width:${p}%;background:${colorBarra(p)}"></i></div><span class="num">${c.hp}/${c.max} HP</span></div>
          </div>
          ${escudo}
        </div>
        <div class="fila2">${caracteristicas}<div class="estbox"><h3>Estados</h3><div class="estados">${chips}</div></div></div>
        ${filaHabs}
        ${papiro}
        ${controles}
        ${extras}
      </div>`;
  }).join("");
  pintarCirculos();
}

function vista() {
  $("#zonaJugador").classList.toggle("oculto", esDJ);
  $("#zonaAlta").classList.toggle("oculto", !esDJ);
  if (esDJ) $("#zonaLogin").classList.add("oculto");
  $("#modo").textContent = esDJ ? "Salir del modo DJ" : "Soy el DJ";
  pintar();
}

/* ---------- Acciones ---------- */
$("#nombre").value = localStorage.getItem("nombrePJ") || "";
$("#nombre").addEventListener("input", e => {
  try { localStorage.setItem("nombrePJ", e.target.value); } catch (_) {}
  pintar();
});

$("#modo").onclick = () => {
  if (esDJ) return almacen.salir();
  $("#zonaLogin").classList.toggle("oculto");
};

$("#entrar").onclick = async () => {
  $("#errorLogin").textContent = "";
  try { await almacen.entrar($("#correo").value, $("#clave").value); }
  catch (_) { $("#errorLogin").textContent = "Correo o contraseña incorrectos."; }
};

$("#zonaAlta").onsubmit = e => {
  e.preventDefault();
  if (Object.keys(personajes).length >= MAX_PERSONAJES) { alert("Ya hay 6 personajes."); return; }
  const max = Math.max(1, parseInt($("#altaMax").value, 10) || 1);
  almacen.guardar(Date.now().toString(36), { nombre: $("#altaNombre").value.trim(), hp: max, max });
  e.target.reset();
};

$("#barras").onclick = e => {
  const b = e.target.closest("button");
  if (!b || !esDJ || !b.dataset.id) return;
  const d = b.dataset, id = d.id, c = personajes[id];
  if (!c) return;
  if ("borrar" in d) { if (confirm(`¿Borrar a ${c.nombre}?`)) almacen.borrar(id); return; }
  if ("quitarEstado" in d) {
    const l = [...(c.estados || [])]; l.splice(Number(d.quitarEstado), 1);
    almacen.actualizar(id, { estados: l }); return;
  }
  if ("quitarObj" in d) {
    const l = [...(c.inventario || [])]; l.splice(Number(d.quitarObj), 1);
    almacen.actualizar(id, { inventario: l }); return;
  }
  if ("quitarHab" in d) { almacen.actualizar(id, { ["habilidades/" + d.quitarHab]: null }); return; }
  if ("buscar" in d) { almacen.actualizar(id, { buscar: !c.buscar }); return; }
  if ("xp" in d) {
    let xp = (c.xp || 0) + Number(d.xp), nivel = c.nivel || 1, puntos = c.puntos || 0;
    const tope = c.xpMax || 20;
    while (xp >= tope) { xp -= tope; nivel++; puntos += 2; }
    almacen.actualizar(id, { xp: Math.max(0, xp), nivel, puntos }); return;
  }
  if ("d" in d) {
    const hp = Math.max(0, Math.min(c.max, c.hp + Number(d.d)));
    almacen.actualizar(id, { hp });
  }
};

$("#barras").addEventListener("submit", e => {
  e.preventDefault();
  if (!esDJ) return;
  const f = e.target, id = f.dataset.id, c = personajes[id], tipo = f.dataset.form;
  const v = [...f.querySelectorAll("input, textarea")].map(i => i.value.trim());
  if (!c) return;
  if (!v[0] && tipo !== "ajustes" && tipo !== "historia") return;
  if (tipo === "estado") {
    almacen.actualizar(id, { estados: [...(c.estados || []), v[0]] });
  } else if (tipo === "ca") {
    almacen.actualizar(id, { ca: Math.max(0, parseInt(v[0], 10) || 0) });
  } else if (tipo === "ajustes") {
    const campos = {}, hpMax = parseInt(v[0], 10), xpMax = parseInt(v[1], 10), niv = parseInt(v[2], 10);
    if (hpMax > 0) { campos.max = hpMax; if (c.hp > hpMax) campos.hp = hpMax; }
    if (xpMax > 0) campos.xpMax = xpMax;
    if (niv > 0) campos.nivel = niv;
    if (Object.keys(campos).length) almacen.actualizar(id, campos);
  } else if (tipo === "atr") {
    const atr = {};
    ATR.forEach(([k], i) => { atr[k] = Math.max(1, Math.min(30, parseInt(v[i], 10) || 10)); });
    almacen.actualizar(id, { atr });
  } else if (tipo === "historia") {
    almacen.actualizar(id, { historia: v[0] || null });
  } else if (tipo === "hab") {
    if (Object.keys(c.habilidades || {}).length >= MAX_HABILIDADES) { alert("Ya tiene 5 habilidades."); return; }
    almacen.actualizar(id, { ["habilidades/" + Date.now().toString(36)]: {
      nombre: v[0], minutos: Math.max(0.1, Number(v[1]) || 5), desc: v[2] || "",
      color: f.querySelector('input[name="color"]:checked')?.value || "verde",
      icono: f.querySelector('input[name="icono"]:checked')?.value || ""
    } });
  } else {
    const inv = c.inventario || [];
    if (inv.length >= MAX_OBJETOS) { alert("El inventario está lleno (máximo 7)."); return; }
    const q = parseInt(v[1], 10);
    almacen.actualizar(id, { inventario: [...inv, { nombre: v[0], cantidad: Number.isNaN(q) ? 1 : Math.max(0, q) }] });
  }
});

$("#barras").addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  if (e.target.open) abiertos.add(id); else abiertos.delete(id);
}, true);

/* ---------- Habilidades: círculos, enfriamiento y descripción ---------- */
function pintarCirculos() {
  document.querySelectorAll(".circulo").forEach(el => {
    const h = personajes[el.dataset.id]?.habilidades?.[el.dataset.hab];
    if (!h) return;
    const resta = h.usadaEn ? h.usadaEn + h.minutos * 60000 - ahora() : 0;
    const espera = resta > 0;
    const seg = Math.ceil(resta / 1000);
    el.classList.toggle("espera", espera);
    if (espera) {
      el.textContent = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
      el.dataset.vista = "tiempo";
    } else if (el.dataset.vista !== "icono") {
      el.innerHTML = ICONOS[h.icono] || esc(h.nombre.trim().charAt(0).toUpperCase());
      el.dataset.vista = "icono";
    }
  });
}
setInterval(pintarCirculos, 1000);

let pulsacion = null, largo = false;
const habDe = el => personajes[el.dataset.id]?.habilidades?.[el.dataset.hab];
document.addEventListener("pointerdown", () => $("#descripcion").classList.add("oculto"));
$("#barras").addEventListener("contextmenu", e => { if (e.target.closest(".circulo, .nombre-pj")) e.preventDefault(); });
$("#barras").addEventListener("pointerdown", e => {
  const el = e.target.closest(".circulo, .nombre-pj");
  if (!el) return;
  largo = false;
  clearTimeout(pulsacion);
  pulsacion = setTimeout(() => {
    const pj = personajes[el.dataset.id];
    const h = el.classList.contains("nombre-pj") ? (pj && pj.historia ? { nombre: pj.nombre, desc: pj.historia } : null) : habDe(el);
    if (!h) return;
    largo = true;
    $("#descripcion").innerHTML = `<b>${esc(h.nombre)}</b>${esc(h.desc || "Sin descripción.")}`;
    $("#descripcion").classList.remove("oculto");
  }, 500);
});
["pointerup", "pointercancel"].forEach(tipo => $("#barras").addEventListener(tipo, e => {
  clearTimeout(pulsacion);
  const el = e.target.closest(".circulo");
  if (tipo !== "pointerup" || !el || largo) return;
  const h = habDe(el);
  if (!h) return;
  const enEspera = h.usadaEn && h.usadaEn + h.minutos * 60000 > ahora();
  if (esDJ || enEspera) return;
  Promise.resolve(almacen.usar(el.dataset.id, el.dataset.hab)).catch(() => alert("No se pudo usar la habilidad. Avisa al DJ."));
}));

vista();
</script>
</body>
</html>
